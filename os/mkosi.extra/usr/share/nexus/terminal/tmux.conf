# NEXUS Terminal: tabs and split panes (usr/lib/nexus/nexus-terminal-session starts one tmux per window with this
# file). The colours come from usr/bin/nexus-terminal (NEXUS_T_*), which reads Ajustes → Terminal.
# The person's own ~/.tmux.conf is not read here: plain `tmux` typed in a shell keeps using it.

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB:clipboard:ccolour:cstyle:focus:title:usstyle:hyperlinks:sync"
set -g default-command "/usr/lib/nexus/nexus-terminal-shell"
set -g mouse on
set -s escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -s set-clipboard on
set -g visual-bell off
set -g bell-action none
set -g display-time 1500
set -g allow-passthrough on
# a tab is named after the program running in it, or after the folder when it is just the shell
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{||:#{==:#{pane_current_command},zsh},#{==:#{pane_current_command},bash}},#{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}},#{pane_current_command}}"

# ---- the tab bar, at the top: the open tab in the terminal's own colour, a "+" after the last one
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-style "bg=${NEXUS_T_BAR},fg=${NEXUS_T_DIM}"
set -g window-status-format "#[bg=${NEXUS_T_BAR},fg=${NEXUS_T_DIM}]   #W   "
set -g window-status-current-format "#[bg=${NEXUS_T_BG},fg=${NEXUS_T_ACCENT}] ● #[fg=${NEXUS_T_FG},bold]#W#[nobold]   "
set -g status-right "#[fg=${NEXUS_T_DIM}]#{?window_zoomed_flag,panel ampliado  ·  ,}#{?#{>:#{window_panes},1},#{window_panes} paneles  ·  ,}#{s|^$HOME|~|:pane_current_path} "
set -g status-format[0] "#[align=left]#{W:#[range=window|#{window_index}]#{E:window-status-format}#[norange],#[range=window|#{window_index}]#{E:window-status-current-format}#[norange]}#[range=user|new,bg=${NEXUS_T_BAR},fg=${NEXUS_T_DIM}]  +  #[norange]#[align=right]#{E:status-right}"
set -g message-style "bg=${NEXUS_T_ACCENT},fg=#ffffff"
set -g message-command-style "bg=${NEXUS_T_ACCENT},fg=#ffffff"
set -g mode-style "bg=${NEXUS_T_ACCENT},fg=#ffffff"

# ---- panes: a thin line between them, the active one in the accent colour
set -g pane-border-lines single
set -g pane-border-style "fg=${NEXUS_T_LINE}"
set -g pane-active-border-style "fg=${NEXUS_T_ACCENT}"

# ---- the mouse: click a tab to go to it, the "+" for a new one, the middle button closes a tab; what is selected
# with the mouse is copied (Ctrl+Shift+V pastes)
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},new}" "new-window -c '#{pane_current_path}'" "select-window -t ="
bind -n MouseDown2Status kill-window -t =
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -n DoubleClick1Pane select-pane -t = \; copy-mode -M \; send -X select-word \; send -X copy-pipe-and-cancel "wl-copy"
bind -n TripleClick1Pane select-pane -t = \; copy-mode -M \; send -X select-line \; send -X copy-pipe-and-cancel "wl-copy"

# ---- the keys. foot sends a private code for each one (the [text-bindings] nexus-terminal writes), in this order.
set -s user-keys[0] "\e[5001~"
set -s user-keys[1] "\e[5002~"
set -s user-keys[2] "\e[5003~"
set -s user-keys[3] "\e[5004~"
set -s user-keys[4] "\e[5005~"
set -s user-keys[5] "\e[5006~"
set -s user-keys[6] "\e[5007~"
set -s user-keys[7] "\e[5008~"
set -s user-keys[8] "\e[5009~"
set -s user-keys[9] "\e[5010~"
set -s user-keys[10] "\e[5011~"
set -s user-keys[11] "\e[5012~"
set -s user-keys[12] "\e[5013~"
set -s user-keys[13] "\e[5014~"
set -s user-keys[14] "\e[5015~"
set -s user-keys[15] "\e[5016~"
set -s user-keys[16] "\e[5017~"
set -s user-keys[17] "\e[5018~"
set -s user-keys[18] "\e[5019~"
set -s user-keys[19] "\e[5020~"
set -s user-keys[20] "\e[5021~"
set -s user-keys[21] "\e[5022~"
set -s user-keys[22] "\e[5023~"
# Ctrl+Shift+T: new tab, in the same folder · Ctrl+Shift+W: close this pane (the tab with its last one)
bind -n User0 new-window -c "#{pane_current_path}"
bind -n User1 kill-pane
# Ctrl+Shift+D: a pane to the right · Ctrl+Shift+E: a pane below
bind -n User2 split-window -h -c "#{pane_current_path}"
bind -n User3 split-window -v -c "#{pane_current_path}"
# Ctrl+Tab and Ctrl+Shift+Tab: next and previous tab
bind -n User4 next-window
bind -n User5 previous-window
# Ctrl+Shift+N: another window, in the same folder
bind -n User6 run-shell -b "cd '#{pane_current_path}' && exec nexus-terminal >/dev/null 2>&1"
# Ctrl+Shift+Z: this pane fills the window, and back
bind -n User7 resize-pane -Z
# Ctrl+Shift+F: search in what is on the screen and above
bind -n User8 copy-mode \; command-prompt -p "Buscar:" "send -X search-backward '%%'"
# Ctrl+Shift+arrows: move between panes (Alt+arrows belong to the desktop: they move the window)
bind -n User9 select-pane -L
bind -n User10 select-pane -R
bind -n User11 select-pane -U
bind -n User12 select-pane -D
# Alt+1…9: go to that tab
bind -n User13 select-window -t :1
bind -n User14 select-window -t :2
bind -n User15 select-window -t :3
bind -n User16 select-window -t :4
bind -n User17 select-window -t :5
bind -n User18 select-window -t :6
bind -n User19 select-window -t :7
bind -n User20 select-window -t :8
bind -n User21 select-window -t :9
# Ctrl+Shift+R: name this tab
bind -n User22 command-prompt -p "Nombre de la pestaña:" "rename-window '%%'"
