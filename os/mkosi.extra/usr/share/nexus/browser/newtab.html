<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nueva pestaña</title>
<!-- The Navegador's start page, Safari-style: the search box (NEXUS Search, browser/search.html), Favoritos, the pages
     you open most (Browser.qml → sessiond GET /search/frequent → window.nexusFrequent) and your localhost servers
     (GET /ports → window.nexusServers). Everything that comes from outside is set with textContent. -->
<style>
  :root { --bg: #090b12; --card: rgba(20, 24, 38, .66); --border: rgba(255, 255, 255, .09); --text: #e8ebff; --dim: #98a0c3;
          --faint: #5d6488; --accent: #7c6cff; --accent2: #38d9ff; --field: rgba(255, 255, 255, .065); }
  :root.light { --bg: #f1f3f9; --card: rgba(255, 255, 255, .84); --border: rgba(0, 0, 0, .08); --text: #151a2b; --dim: #5b6382;
                --faint: #9aa1bb; --field: rgba(255, 255, 255, .95); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased;
         display: flex; flex-direction: column; align-items: center; padding: 11vh 24px 60px; }
  a { color: inherit; text-decoration: none; }
  .aurora { position: fixed; inset: -20%; z-index: -1; filter: blur(70px); opacity: .5; pointer-events: none;
            background: radial-gradient(40% 35% at 20% 25%, #6d3cff 0, transparent 70%),
                        radial-gradient(35% 30% at 85% 30%, #13c8ff 0, transparent 70%),
                        radial-gradient(45% 40% at 60% 95%, #c13cff 0, transparent 70%); }
  :root.light .aurora { opacity: .22; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .brand img { width: 52px; height: 52px; filter: drop-shadow(0 0 16px rgba(63, 240, 255, .4)); }
  .brand span { font-size: 22px; letter-spacing: .3em; font-weight: 600; }
  .brand small { display: block; font-size: 12px; letter-spacing: .12em; color: var(--dim); font-weight: 500; margin-top: 2px; }
  form { width: min(640px, 100%); position: relative; }
  input { width: 100%; height: 56px; border-radius: 18px; border: 1px solid var(--border); background: var(--field); color: var(--text);
          font: 17px Inter, sans-serif; padding: 0 22px 0 54px; outline: none; box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
          transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(124, 108, 255, .25), 0 12px 40px rgba(0, 0, 0, .25); }
  input::placeholder { color: var(--faint); }
  form svg { position: absolute; left: 20px; top: 18px; }
  .hint { margin-top: 12px; color: var(--dim); font-size: 13px; text-align: center; }
  .hint code { font-family: "JetBrains Mono", monospace; font-size: 12px; background: var(--field); border: 1px solid var(--border);
               border-radius: 6px; padding: 1px 6px; color: var(--text); }
  section { width: min(700px, 100%); margin-top: 38px; }
  h2 { font-size: 17px; font-weight: 650; margin: 0 0 14px; letter-spacing: -.01em; }
  /* Favoritos: Safari's grid of icons with the name underneath */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 18px 10px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); text-align: center; }
  .tile .ic { width: 62px; height: 62px; border-radius: 16px; display: grid; place-items: center; font-size: 24px; font-weight: 700; color: #fff;
              box-shadow: 0 6px 18px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .25); transition: transform .14s ease, box-shadow .14s ease; }
  .tile:hover .ic { transform: translateY(-3px) scale(1.04); box-shadow: 0 12px 26px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .25); }
  .tile:hover { color: var(--text); }
  .tile span { max-width: 84px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Visitadas a menudo */
  .freq { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .freq a { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 14px; background: var(--card); border: 1px solid var(--border);
            backdrop-filter: blur(20px); min-width: 0; transition: border-color .12s, transform .12s; }
  .freq a:hover { border-color: var(--accent); transform: translateY(-1px); }
  .freq .ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 15px; }
  .freq b { display: block; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .freq small { display: block; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .freq div { min-width: 0; }
  /* Servidores en marcha */
  .srv-title { display: flex; align-items: center; gap: 9px; }
  .srv-title .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc97; box-shadow: 0 0 0 4px rgba(61, 220, 151, .18); }
  .srv-list { display: flex; flex-wrap: wrap; gap: 10px; }
  .srv-list a { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; border-radius: 12px; background: var(--card);
                border: 1px solid var(--border); backdrop-filter: blur(20px); }
  .srv-list a b { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 14px; }
  .srv-list a small { color: var(--dim); font-size: 12px; }
  .srv-list a:hover { border-color: #3ddc97; }
  .srv-none { color: var(--faint); font-size: 13px; }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="brand">
  <img src="../icons/pantera-logo.png" alt="">
  <div><span>NEXUS</span><small>SEARCH</small></div>
</div>
<form id="f" autocomplete="off" role="search">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--dim)"><circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.6-4.6"/></svg>
  <input id="q" placeholder="Busca con NEXUS Search o escribe una dirección" autofocus>
</form>
<div class="hint">Busca en tu equipo y en la web a la vez · Atajos: <code>gh</code> GitHub · <code>so</code> Stack Overflow · <code>mdn</code> · <code>npm</code> · <code>pypi</code> · <code>localhost:3000</code></div>

<section>
  <h2>Favoritos</h2>
  <div class="tiles" id="favs"></div>
</section>
<section id="freqBox" hidden>
  <h2>Visitadas a menudo</h2>
  <div class="freq" id="freq"></div>
</section>
<section id="srv" hidden>
  <h2 class="srv-title"><span class="dot"></span>Servidores en marcha en este equipo</h2>
  <div id="srvList" class="srv-list"></div>
</section>
<script>
  "use strict";
  const LIGHT = new URLSearchParams(location.search).get("theme") === "light";
  if (LIGHT) document.documentElement.classList.add("light");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const HUES = [262, 196, 330, 150, 28, 210, 285, 175];
  const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return HUES[h % HUES.length]; };
  const icon = (cls, label, key) => { const i = el("span", cls, label); const h = hue(key); i.style.background = "linear-gradient(145deg, hsl(" + h + " 70% 58%), hsl(" + ((h + 40) % 360) + " 65% 42%))"; return i; };

  // Same rules as the address bar (Browser.qml toUrl): shortcuts, addresses, and everything else to NEXUS Search
  const BANGS = { gh: "https://github.com/search?type=repositories&q=", so: "https://stackoverflow.com/search?q=",
                  mdn: "https://developer.mozilla.org/es/search?q=", npm: "https://www.npmjs.com/search?q=",
                  pypi: "https://pypi.org/search/?q=" };
  function toUrl(t) {
    t = t.trim(); if (!t) return "";
    const m = /^(gh|so|mdn|npm|pypi)\s+(.+)$/i.exec(t);
    if (m) return BANGS[m[1].toLowerCase()] + encodeURIComponent(m[2]);
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(t)) return t;
    if (/^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])(:\d+)?(\/.*)?$/i.test(t) || /^\d{1,3}(\.\d{1,3}){3}(:\d+)?(\/.*)?$/.test(t)) return "http://" + t;
    if (!/\s/.test(t) && /^[^\/\s]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(t)) return "https://" + t;
    return "search.html?q=" + encodeURIComponent(t) + (LIGHT ? "&theme=light" : "");
  }
  document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); const u = toUrl(document.getElementById("q").value); if (u) location.href = u; });

  // Favoritos
  const FAVS = [["GitHub", "https://github.com"], ["Stack Overflow", "https://stackoverflow.com"], ["MDN", "https://developer.mozilla.org/es/"],
                ["Claude API", "https://platform.claude.com/docs"], ["Python", "https://docs.python.org/es/3/"], ["Rust", "https://doc.rust-lang.org/std/"],
                ["Can I use", "https://caniuse.com"], ["Debian", "https://packages.debian.org"], ["Wikipedia", "https://es.wikipedia.org"], ["YouTube", "https://www.youtube.com"]];
  for (const [name, url] of FAVS) {
    const a = el("a", "tile"); a.href = url;
    a.append(icon("ic", name[0], name), el("span", "", name)); document.getElementById("favs").append(a);
  }

  // NEXUS fills these in (Browser.qml): the pages you open most (NEXUS Search remembers them only on this computer)
  window.nexusFrequent = function (list) {
    const box = document.getElementById("freqBox"), ul = document.getElementById("freq");
    ul.replaceChildren();
    for (const p of (Array.isArray(list) ? list : []).slice(0, 8)) {
      let u; try { u = new URL(String(p.url)); } catch (e) { continue; }
      if (u.protocol !== "https:" && u.protocol !== "http:") continue;
      const host = u.hostname.replace(/^www\./, "");
      const a = el("a"); a.href = u.href;
      const t = el("div"); t.append(el("b", "", String(p.title || host)), el("small", "", host));
      a.append(icon("ic", host[0].toUpperCase(), host), t); ul.append(a);
    }
    box.hidden = !ul.children.length;
  };
  // ...and your servers listening on localhost, live (sessiond GET /ports)
  window.nexusServers = function (list) {
    const box = document.getElementById("srv"), ul = document.getElementById("srvList");
    box.hidden = false; ul.replaceChildren();
    if (!Array.isArray(list) || !list.length) {
      ul.append(el("div", "srv-none", "Ninguno ahora mismo. Arranca uno (npm run dev, python3 -m http.server…) y aparecerá aquí."));
      return;
    }
    for (const s of list.slice(0, 12)) {
      const a = el("a"); a.href = "http://localhost:" + Number(s.port);
      a.append(el("b", "", ":" + Number(s.port)), el("small", "", [s.process || "servidor", s.folder].filter(Boolean).join(" · ")));
      ul.append(a);
    }
  };
</script>
</body>
</html>
