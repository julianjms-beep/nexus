# NEXUS OS: kernel protections (read by systemd-sysctl at boot). Each one closes a known way in; none of them changes
# how the desktop, the browser, bubblewrap's sandboxes or development tools work.

# --- the kernel does not tell programs where it lives in memory, and its log is for administrators
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# --- a program may only inspect (ptrace) the programs it started itself: one app cannot read another's memory
#     (debuggers still work on what they launch; `sudo gdb -p` for the rest)
kernel.yama.ptrace_scope = 1
# --- eBPF and perf events are for administrators; the JIT hides its constants
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
kernel.perf_event_paranoid = 3
# --- nobody swaps the running kernel for another one, and the magic SysRq keys only sync/remount/reboot
kernel.kexec_load_disabled = 1
kernel.sysrq = 176
# --- a crashed setuid program does not leave its memory in a file
fs.suid_dumpable = 0
# --- the classic /tmp tricks (links, FIFOs and files planted in shared folders)
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# --- network: this computer is not a router and does not let others redirect its traffic
# (loose mode: a laptop on Wi-Fi and cable at once keeps working)
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
# --- IPv6 addresses that change, so the computer cannot be followed from network to network
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2
