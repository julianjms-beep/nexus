# NEXUS OS system identities. Only what systemd-sysusers can check without writing: a membership line ("m") makes it
# rewrite /etc/group and /etc/gshadow on EVERY run (first boot, and each boot after /usr changed), and on a slow disk
# that write got it killed by its timeout (systemd-sysusers.service "failed" on a first boot from an exFAT USB disk,
# 2026-11-10). nexus-engine joins nexus-shell in os/mkosi.postinst.chroot and os/update/post.sh instead.
g nexus-shell  -
u nexus-engine - "NEXUS Engine" /var/lib/nexus /usr/sbin/nologin
g nexus-update -
