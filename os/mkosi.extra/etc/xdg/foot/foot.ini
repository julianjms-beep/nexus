# NEXUS OS terminal theme (foot 1.21). Users can override it in ~/.config/foot/foot.ini.
[main]
font=JetBrains Mono:size=11
pad=16x14
title=Terminal
locked-title=yes
initial-window-size-chars=100x30

[cursor]
style=beam
blink=yes
color=0b0d14 7c6cff

[mouse]
hide-when-typing=yes

[colors]
alpha=1.0
background=0b0d14
foreground=dfe2f0
selection-foreground=ffffff
selection-background=3a2f7a
regular0=1a1d2b
regular1=ff5c7a
regular2=3ddc97
regular3=ffb84d
regular4=6c8cff
regular5=a78bfa
regular6=3fd0e0
regular7=c8ccdc
bright0=4a4f66
bright1=ff7a93
bright2=6ee7b7
bright3=ffd27a
bright4=8fa8ff
bright5=c4b5fd
bright6=7ae6f0
bright7=ffffff
