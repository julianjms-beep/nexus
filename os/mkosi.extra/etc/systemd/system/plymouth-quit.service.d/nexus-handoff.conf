# NEXUS: quit plymouth only after the desktop session has the display, leaving its picture on screen until the
# compositor's first frame (usr/libexec/nexus-plymouth-handoff). Runs in the background (simple, not oneshot) so the
# boot does not wait for it; falls back to a plain quit after 10 s with no session.
[Unit]
After=greetd.service

[Service]
Type=simple
ExecStart=
ExecStart=-/usr/libexec/nexus-plymouth-handoff release
