# NEXUS: greetd waits for this unit. Instead of waiting for plymouth to exit, only deactivate it: the splash picture
# stays on screen while the session starts, and labwc takes the display over from it (no black screen in between).
# Plymouth exits a moment later in plymouth-quit.service (usr/libexec/nexus-plymouth-handoff).
[Service]
ExecStart=
ExecStart=-/usr/libexec/nexus-plymouth-handoff hold
