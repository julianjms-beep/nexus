# NEXUS OS: name resolution.
# LLMNR and multicast DNS answer anyone on the local network who asks for this computer's name (and are the classic
# way to trick a computer into talking to an impostor): off. That also closes port 5355.
# DNS over TLS when the network's DNS server offers it (it falls back to plain DNS when it does not), so the names
# of the pages visited do not travel in the clear.
[Resolve]
LLMNR=no
MulticastDNS=no
DNSOverTLS=opportunistic
