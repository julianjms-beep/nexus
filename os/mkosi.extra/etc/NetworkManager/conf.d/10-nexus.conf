# NEXUS OS: NetworkManager looks after Wi-Fi (the menu bar's Wi-Fi menu, Ajustes → Wi-Fi, the first-boot setup).
# Wired cards stay with systemd-networkd (/etc/systemd/network/80-dhcp.network), exactly as before, so a cable keeps
# working the same way and an update can never leave a wired computer without network.
[main]
plugins=keyfile

[keyfile]
unmanaged-devices=interface-name:en*;interface-name:eth*

[device]
# a random MAC while scanning, the real one once connected (as phones and Macs do)
wifi.scan-rand-mac-address=yes
