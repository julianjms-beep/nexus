# Dev image: key-only SSH (the lab key is added at build time, never stored in git)
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# Remote access is a switch in Ajustes → Privacidad y seguridad (the firewall opens port 22 only while it is on).
# Keys only, people only, few tries, and no forwarding of screens or agents.
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
PermitEmptyPasswords no
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u
