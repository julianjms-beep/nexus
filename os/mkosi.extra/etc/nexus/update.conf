# NEXUS Update: where NEXUS OS looks for its updates (Ajustes → Actualizaciones; core/src/updated.ts).
# Everything this channel offers must be signed with NEXUS's key (/usr/share/nexus/update/signing.pub), so a plain
# http:// channel is as safe as https:// here. DEV IMAGE: the lab channel (vm/lab/publish-update.sh). It lives on the
# builder VM; macOS keeps its VMs apart, so the Mac passes it on at 192.168.64.1, its address on the VMs' private network.
channel=http://192.168.64.1:8090/nexus/stable/
