# NEXUS Update: where NEXUS OS looks for its updates (Ajustes → Actualizaciones; core/src/updated.ts).
# Everything this channel offers must be signed with NEXUS's key (/usr/share/nexus/update/signing.pub), so a plain
# http:// channel is as safe as https:// here. The channel is the branch "canal" of NEXUS's public repository on GitHub (the files
# vm/lab/publish-update.sh uploads there), so updates arrive over any internet connection.
channel=https://raw.githubusercontent.com/julianjms-beep/nexus/canal/
