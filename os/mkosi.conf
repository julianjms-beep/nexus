# NEXUS OS image (dev profile). Build inside the Debian builder VM: os/build.sh
[Distribution]
Distribution=debian
Release=trixie
# Architecture= and the kernel package (linux-image-<arch>) come from os/build.sh: arm64 by default, NEXUS_ARCH=amd64 for PCs
Repositories=main,non-free-firmware

[Output]
Format=disk
Output=nexus-os
ImageId=nexus-os
ImageVersion=0.2.18
CompressOutput=no
SplitArtifacts=no

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
KernelCommandLine=rw quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0 plymouth.ignore-serial-consoles console=tty1 console=hvc0
Hostname=nexus
Locale=es_ES.UTF-8
Keymap=es
Timezone=Europe/Madrid
RootPassword=hashed:!
RootShell=/bin/bash
WithDocs=no
CleanPackageMetadata=no
Packages=
        # base system
        systemd,systemd-sysv,systemd-boot,systemd-boot-efi,systemd-resolved,systemd-timesyncd,systemd-zram-generator
        udev,dbus,dbus-user-session,libpam-systemd,polkitd,kmod
        iproute2,iputils-ping,netbase,ca-certificates,curl,openssh-server,sudo,less,nano,procps,psmisc,util-linux
        # security: the firewall (nexus-firewall), the automatic lock (nexus-idle)
        nftables,swayidle
        bubblewrap,locales,tzdata,bash-completion,file,xz-utils,login,passwd,rsync,apt,systemd-repart
        # software engineering: the tools a fresh NEXUS needs to clone, build and test a project (node/npm come from os/build.sh)
        git,openssh-client,build-essential,python3-venv,python3-pip,ripgrep,jq,tmux,unzip
        # a terminal ready for anything: `python` and `pip` by those names, pipx, the GitHub CLI, an editor, a debugger…
        python-is-python3,python3-dev,pipx,wget,zip,vim,htop,tree,sqlite3,gh,cmake,pkg-config,gdb,fzf,man-db
        # devices: Wi-Fi (NetworkManager; cables stay with systemd-networkd), Bluetooth, sound (PipeWire), screen
        # brightness, power modes, what is playing, airplane mode — the menu bar's Wi-Fi, battery and Control Center
        network-manager,wpasupplicant,iw,rfkill,bluez,pipewire,pipewire-pulse,pipewire-alsa,wireplumber,rtkit
        power-profiles-daemon,brightnessctl,playerctl
        # the firmware real laptops' Wi-Fi and Bluetooth chips need (Intel, Realtek, MediaTek, Qualcomm Atheros, Broadcom)
        firmware-iwlwifi,firmware-realtek,firmware-mediatek,firmware-atheros,firmware-brcm80211
        # graphical session
        greetd,tuigreet,labwc,foot,gtklock,swaylock,swaybg,plymouth,grim,wlr-randr,wl-clipboard,wlrctl,wtype,xkb-data
        python3-gi,gir1.2-gtk-3.0,gir1.2-gtklayershell-0.1
        qml-qt6,qt6-wayland,qt6-svg-plugins,libqt6svg6
        qml6-module-qtquick,qml6-module-qtquick-controls,qml6-module-qtquick-layouts,qml6-module-qtquick-window
        qml6-module-qtquick-templates,qml6-module-qtqml-workerscript,qml6-module-qtquick-effects,qml6-module-qtquick-shapes
        qml6-module-qtqml,qml6-module-qtqml-models,qml6-module-qtcore,qml6-module-qt-labs-folderlistmodel
        qml6-module-org-kde-layershell,qml6-module-qtwebengine
        libgl1-mesa-dri,libegl-mesa0,libgles2
        fonts-inter,fonts-jetbrains-mono,fonts-noto-color-emoji,fonts-dejavu-core,fonts-noto-cjk
        # VS Code (Microsoft's package; os/build.sh puts it in the local package folder after apt checks its signature)
        code
